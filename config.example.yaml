# Telegram SLA Monitor v0.5.5 — твои настройки.
# Авторизация существующих и новых сессий: python login_telethon.py
# Файл .session НЕ нужно дописывать к имени: Telethon создаёт его сам.

# 1. Telegram API. Один комплект для логинилки и монитора.
api_id: 2040
api_hash: "b18441a1ff607e10a989891a5462e627"

# 2. Путь сессии для login_telethon.py.
# Монитор использует отдельное поле session_file каждого оператора ниже.
login_session_name: "sessions/operator_1"

# 3. Бот уведомлений и получатели.
# Руководитель и операторы должны отправить боту /start перед запуском.
notifier_bot_token: "123456789:PASTE_YOUR_TELEGRAM_BOT_TOKEN"
main_telegram_id: 111111111
notify_operator: true           # true: уведомлять также оператора
                                # Если оператор и главный — один человек, дубля не будет.

# 4. Технические уведомления — ТОЛЬКО разработчику (новое в v0.5.5).
# Оператор не подключён или сессия отозвана, пропала связь с Telegram, бот не может
# кому-то писать, второй экземпляр монитора, падение, запуск и остановка.
# Руководитель и операторы их не получают. Тихие часы на них не действуют.
# Разработчик должен один раз нажать /start у бота.
# Свой ID можно узнать: python sla_monitor.py whoami (при остановленном run).
developer_telegram_id: 222222222       # ← впиши свой Telegram ID вместо null
tech_alert_delay_seconds: 300     # о пропаже связи сообщать, если она длится 5+ минут
tech_alert_repeat_seconds: 21600  # напоминать о неустранённой проблеме раз в 6 ч; 0 = не повторять

# 5. Когда считать обращение просроченным.
# unread     — лид написал, оператор не прочитал сообщение.
# unanswered — лид написал, оператор не ответил (даже если прочитал).
# both       — проверять оба условия; уведомления по ним независимы.
alert_mode: "unread"
sla_seconds: 7200                 # ТЕСТ: 60 сек.; в работе 7200 = 2 часа
poll_interval_seconds: 60       # пауза ПОСЛЕ полного обхода; в работе 60
remind_every_seconds: 900        # ТЕСТ: повтор через 80 сек.; в работе 900 = 15 минут
max_reminders: 0                # 0 = без ограничения

# 6. Тихие часы (UTC+3). Диалоги проверяются, уведомления не отправляются.
utc_offset_hours: 3
quiet_hours:
  start: "22:00"
  end: "10:00"
# Для круглосуточных уведомлений замени блок quiet_hours выше одной строкой:
# quiet_hours: 0                # именно число, без кавычек

# 7. Какие диалоги проверять.
# Служебный чат Telegram (777000) и переписки сотрудников (главный, разработчик,
# операторы) исключаются автоматически.
only_contacts: false           # проверять не только контакты
include_archived: false       # не проверять архив
# Если в Telegram включено «Архивировать новые чаты от не-контактов», новые лиды
# уходят в архив: тогда ставь true (монитор проверит это и предупредит разработчика).
include_ids: []               # [] = все подходящие чаты; иначе список ID
exclude_ids: []               # [] = никого не исключать
message_preview_len: 160      # длина фрагмента сообщения в уведомлении
history_scan_limit: 500       # оставлено из старого конфига
unread_scan_limit: 200        # глубина поиска старейшего непрочитанного
alert_existing_chats_on_start: true  # учитывать старые обращения на первом старте
# Входящие старше N часов НЕ открывают новое обращение: ни при первом старте,
# ни в «ожившем» старом чате. Уже идущие обращения окно не закрывает. 0 = без ограничения.
history_max_age_hours: 72

# 8. Защита от FloodWait. Если Telegram часто ограничивает запросы,
# увеличь задержки до 5.0, но полный обход диалогов станет медленнее.
history_request_delay_seconds: 3.2
history_page_delay_seconds: 3.2
flood_wait_extra_seconds: 3

# 9. Статистика: только для main_telegram_id через /stats в личке с ботом.
# Автоматических отчётов нет. По запросу доступна выгрузка в Excel.
stats_enabled: true
edit_resolved_alerts: true

# 10. Подробный журнал для проверки галочек, повторов и FloodWait.
# В консоли останутся основные события, детальная диагностика — в файл.
# Файл до 10 МБ, затем хранится ещё 3 предыдущих копии.
debug_logging: true
debug_log_file: "logs/sla_debug.log"  # путь от папки config.yaml
# После проверки можно поставить debug_logging: false.
# Файл содержит ID диалогов и сообщений, не пересылай его публично.

# 11. Сохранение состояния и истории статистики.
# При обновлении сохрани старую базу, чтобы не потерять открытые обращения.
state_db: "sla_state.sqlite3"

# 12. Операторы. name и session_file не переименовывать при обновлении:
# к ним привязаны текущие обращения и накопленная статистика.
sessions:
  - name: "operator_1"
    operator_label: "Operator 1"
    operator_telegram_id: 333333333
    session_file: "sessions/operator_1"

  # Второго оператора сначала авторизуй через login_telethon.py:
  # временно поменяй login_session_name на sessions/operator_petr.
  # Потом добавь сюда его реальные данные:
  # - name: "operator_petr"
  #   operator_label: "Пётр"
  #   operator_telegram_id: 333333333
  #   session_file: "sessions/operator_petr"
